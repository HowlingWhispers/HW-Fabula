<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111713" />
  <title>HW Fabula</title>
  <link rel="stylesheet" href="/web/styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">F</div>
        <div>
          <div class="brand-title">Fabula</div>
          <div class="brand-subtitle">authoritative world runtime</div>
        </div>
      </div>
      <div class="topbar-status">
        <span id="sourceBadge" class="status-pill muted">Orbis</span>
        <span id="revisionBadge" class="status-pill">r0</span>
      </div>
    </header>

    <div class="desktop-frame">
      <aside id="desktopNav" class="desktop-nav" aria-label="Fabula navigation"></aside>
      <main id="content" class="content" aria-live="polite"></main>
    </div>

    <nav id="bottomNav" class="bottom-nav" aria-label="Fabula navigation"></nav>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="assertive"></div>

  <dialog id="factDialog" class="dialog">
    <form id="factForm" method="dialog" class="dialog-card">
      <div class="dialog-head">
        <div>
          <div class="eyebrow">PRIVATE INSTANCE FACT</div>
          <h2>Record an outcome</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Close">×</button>
      </div>
      <p class="muted-copy">This records a private durable fact. It does not alter Orbis or shared canon.</p>
      <label>Type
        <select name="type">
          <option value="place">Place</option>
          <option value="npc">NPC</option>
          <option value="faction">Faction</option>
          <option value="item">Item</option>
          <option value="event" selected>Event</option>
          <option value="lore">Lore</option>
          <option value="narrative_beat">Narrative beat</option>
          <option value="legacy">Legacy</option>
        </select>
      </label>
      <label>Title<input name="title" maxlength="100" required placeholder="What changed?" /></label>
      <label>Summary<textarea name="summary" maxlength="800" required placeholder="State the durable outcome, not the private transcript."></textarea></label>
      <label>Scope
        <select name="scope">
          <option value="personal">Personal</option>
          <option value="local" selected>Local</option>
          <option value="place">Place</option>
          <option value="regional">Regional</option>
          <option value="world">World</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button class="button secondary" value="cancel">Cancel</button>
        <button class="button primary" value="default">Record privately</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/web/app.js"></script>
</body>
</html>
